<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎮 12 Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#1a0b2e,#0a0514 80%);padding:1rem;color:#f5eaff;display:flex;justify-content:center}
.hub{max-width:1000px;width:100%;background:rgba(20,12,35,.9);border-radius:2rem;padding:1.2rem;border:1px solid #6b3fa0;box-shadow:0 20px 50px #000}
h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#ffb86b,#ff5f9e,#b16cff,#6bcaff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.2rem}
.sub{text-align:center;color:#cbb3ff;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1rem;border-bottom:1px dashed #5b3a91;padding-bottom:.6rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.5rem;margin-bottom:1rem}
.card{background:rgba(35,20,60,.9);border:1px solid #6b3fa0;border-radius:1rem;padding:.6rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;transition:.15s;text-align:center}
.card:hover{background:rgba(70,40,120,.95);border-color:#c77dff;transform:translateY(-2px)}
.card.active{background:linear-gradient(145deg,#4a2073,#1e0b38);border-color:#e0aaff;box-shadow:0 0 0 2px #b16cff}
.card .e{font-size:1.6rem}
.card .n{font-size:.72rem;font-weight:700;color:#f3e8ff;line-height:1.1}
.card .t{font-size:.55rem;color:#d4b3ff;background:#1b0e2e;padding:.1rem .4rem;border-radius:20px;border:1px solid #6b3fa0}
.stage{background:#100820;border-radius:1.5rem;padding:1.2rem;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;border:1px solid #4a2a78;position:relative;overflow:hidden}
.msg{font-size:1.1rem;font-weight:700;color:#e5ccff;text-align:center;text-shadow:0 2px 10px #a855f7}
button{background:linear-gradient(145deg,#6a2fc2,#3b1477);border:none;color:#fff;padding:.55rem 1.2rem;font-size:.82rem;font-weight:700;border-radius:40px;cursor:pointer;box-shadow:0 6px 8px -4px #00000090,0 0 0 1px #b47aff inset;transition:.15s;text-transform:uppercase;letter-spacing:.3px}
button:hover:not(:disabled){background:linear-gradient(145deg,#8541e8,#4d1a94);transform:scale(1.03)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;align-items:center}
.stat{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;font-size:.75rem;font-weight:700;color:#d4b3ff}
.stat span{background:#1b0e2e;padding:.25rem .7rem;border-radius:30px;border:1px solid #6b3fa0}
.res{font-size:1rem;font-weight:800;color:#ffe066;background:#1a0d2e;padding:.5rem 1.2rem;border-radius:40px;border:1px solid #b16cff;text-align:center}
input{background:#150a28;border:2px solid #7b3fc0;color:#f3e8ff;padding:.55rem .9rem;font-size:.9rem;border-radius:40px;text-align:center;width:120px;outline:none;font-weight:700}
input:focus{border-color:#c77dff;box-shadow:0 0 15px #a855f7}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;max-width:320px;width:100%}
.mcard{aspect-ratio:1;background:linear-gradient(145deg,#3a1a6b,#1e0b38);border:2px solid #6b3fa0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;user-select:none;transition:.2s;box-shadow:0 4px 0 #150828}
.mcard:hover:not(.flip):not(.match){transform:translateY(-2px);border-color:#c77dff}
.mcard.flip{background:#f0e0ff;color:#2a0a4a}
.mcard.match{background:#5ef08a;color:#0a2818;cursor:default;box-shadow:0 0 12px #4ade80}
.rbox{width:100%;max-width:360px;height:160px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;cursor:pointer;user-select:none;text-align:center;padding:1rem;transition:.15s}
.r-wait{background:#2d1554;border:3px solid #6b3fa0;color:#d4b3ff}
.r-go{background:#c2185b;border:3px solid #ffb0d0;color:#fff;font-size:1.6rem;box-shadow:0 0 40px #ff5f9e}
.r-done{background:#2bb45a;border:3px solid #b0ffc4;color:#0a2818}
.r-early{background:#b71c1c;border:3px solid #ffb0b0;color:#fff}
.q{font-size:1.9rem;font-weight:900;color:#ffe066;padding:.4rem 1.2rem;background:#1a0d2e;border-radius:20px;border:1px solid #b16cff;text-align:center}
.tbar-bg{width:100%;max-width:320px;height:12px;background:#1b0e2e;border-radius:20px;border:1px solid #6b3fa0;overflow:hidden}
.tbar{height:100%;background:linear-gradient(90deg,#5ef08a,#ffe066,#ff5f9e);width:100%;transition:width .1s linear}
.simon-pad{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;max-width:220px;width:100%}
.pad{aspect-ratio:1;border-radius:14px;cursor:pointer;transition:.1s;border:3px solid #000;opacity:.5}
.pad.on{opacity:1;box-shadow:0 0 30px currentColor;transform:scale(1.03)}
.pad.g{background:#4ade80;color:#4ade80}.pad.r{background:#ff5f9e;color:#ff5f9e}.pad.b{background:#6bcaff;color:#6bcaff}.pad.y{background:#ffe066;color:#ffe066}
.slot{display:flex;gap:.5rem;justify-content:center}
.slot .sym{width:60px;height:70px;background:#fff;color:#2a0a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;box-shadow:0 5px 0 #4a1d7a}
.hist{font-size:.7rem;color:#b399dd;letter-spacing:1px;font-weight:600;min-height:1.1rem;text-align:center;word-break:break-word}
.celebrate{position:absolute;inset:0;background:rgba(20,5,40,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;z-index:10;animation:pop .3s ease;text-align:center;padding:1rem}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.cel-big{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#ffb86b,#ff5f9e,#b16cff,#6bcaff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:bounce 1s infinite;letter-spacing:1px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cel-sub{font-size:1.1rem;color:#ffe066;font-weight:800}
.cel-emoji{font-size:3rem;animation:spin 2s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.word-slots{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap}
.word-slot{width:34px;height:44px;border-bottom:3px solid #b16cff;background:#1a0d2e;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;color:#ffe066;border-radius:6px 6px 0 0}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;max-width:380px;width:100%}
.key{background:#2d1554;border:1px solid #6b3fa0;color:#f3e8ff;padding:.45rem .1rem;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;text-align:center;transition:.15s;user-select:none}
.key:hover:not(.used){background:#4a2073;border-color:#c77dff}
.key.used{opacity:.3;cursor:not-allowed}
.key.correct{background:#2bb45a;border-color:#7dffb0;color:#0a2818}
.key.wrong{background:#b71c1c;border-color:#ffb0b0;color:#fff}
.type-target{font-size:1.05rem;font-weight:700;color:#ffe066;background:#1a0d2e;padding:.9rem;border-radius:14px;border:1px solid #b16cff;letter-spacing:.5px;text-align:center;line-height:1.6}
.type-target .ok{color:#4ade80}
.type-target .err{color:#ff5f9e;background:#3a0a1a;border-radius:4px}
.color-box{width:200px;height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;border:3px solid #fff;cursor:pointer;text-shadow:0 2px 8px #000}
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:280px;width:100%}
.mole{aspect-ratio:1;background:#1b0e2e;border:2px solid #6b3fa0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;user-select:none;transition:.1s}
.mole.up{background:#4a2073;border-color:#c77dff}
</style></head><body>
<div class="hub">
<h1>🎮 12 GAMES · YOU DID IT!</h1>
<div class="sub">click a card · play · win</div>
<div class="opts" id="opts"></div>
<div class="stage" id="stage"><div class="msg" id="msg">Pick a game!</div><div id="area" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:.8rem"></div></div>
</div>
<script>
const GAMES=[
{id:'memory',e:'🧩',n:'Memory',t:'pairs'},
{id:'guess',e:'🧠',n:'Mind Reader',t:'1–100'},
{id:'coin',e:'⚡',n:'Streak Flip',t:'call it'},
{id:'reaction',e:'🎯',n:'Reaction',t:'fast!'},
{id:'math',e:'➗',n:'Math Blitz',t:'60s'},
{id:'simon',e:'🎵',n:'Simon Says',t:'repeat'},
{id:'slots',e:'🎰',n:'Slots',t:'spin'},
{id:'rps',e:'✊',n:'Rock Paper',t:'bo5'},
{id:'word',e:'🔤',n:'Hangman',t:'word'},
{id:'typing',e:'⌨️',n:'Typing',t:'speed'},
{id:'color',e:'🌈',n:'Color Match',t:'name≠color'},
{id:'whack',e:'🐹',n:'Whack-a-Mole',t:'reflex'}
];
const opts=document.getElementById('opts'),msg=document.getElementById('msg'),area=document.getElementById('area'),stage=document.getElementById('stage');
let current='memory';
GAMES.forEach(g=>{const c=document.createElement('div');c.className='card'+(g.id===current?' active':'');c.dataset.id=g.id;
c.innerHTML=`<div class="e">${g.e}</div><div class="n">${g.n}</div><div class="t">${g.t}</div>`;
c.onclick=()=>{current=g.id;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('active',x.dataset.id===g.id));render()};
opts.appendChild(c)});
const $=id=>document.getElementById(id);
function msgSet(t){msg.textContent=t}
function areaSet(h){area.innerHTML=h}
const CHEERS=['🎉 YOU DID IT!','🏆 AMAZING!','⭐ CHAMPION!','🔥 LEGENDARY!','💎 PERFECT!','🌟 BRILLIANT!','🚀 OUTSTANDING!','👑 UNSTOPPABLE!'];
function celebrate(text,sub){const ov=document.createElement('div');ov.className='celebrate';
const cheer=CHEERS[Math.floor(Math.random()*CHEERS.length)];
ov.innerHTML=`<div class="cel-emoji">🎊</div><div class="cel-big">${cheer}</div>${text?`<div class="cel-sub">${text}</div>`:''}${sub?`<div style="color:#d4b3ff;font-size:.85rem">${sub}</div>`:''}<button id="celClose">CONTINUE</button>`;
stage.appendChild(ov);ov.querySelector('#celClose').onclick=()=>ov.remove();setTimeout(()=>{if(ov.parentNode)ov.remove()},4500)}
function smallWin(t){const ov=document.createElement('div');ov.className='celebrate';
const cheer=['NICE!','GREAT!','SWEET!','YEAH!','BOOM!','POW!','YES!'][Math.floor(Math.random()*7)];
ov.innerHTML=`<div class="cel-big" style="font-size:1.8rem">${cheer} ${t}</div>`;stage.appendChild(ov);setTimeout(()=>ov.remove(),1300)}

// MEMORY
function memory(){
 msgSet('🧩 Match all pairs');
 const syms=['🍎','🍌','🍇','🍒','🍕','🍩','⭐','🎵'];
 let deck=[...syms,...syms].sort(()=>Math.random()-.5);let flipped=[],matched=0,moves=0,lock=false;
 areaSet(`<div class="stat"><span id="mm">MOVES: 0</span><span id="mp">PAIRS: 0/8</span></div>
 <div class="grid4" id="mg"></div><div class="res" id="mr">find 8 pairs</div><button id="mreset">NEW GAME</button>`);
 const g=$('mg');
 function build(){g.innerHTML='';deck.forEach((s,i)=>{const d=document.createElement('div');d.className='mcard';d.dataset.s=s;d.textContent='?';d.onclick=()=>click(d);g.appendChild(d)})}
 function click(d){if(lock||d.classList.contains('flip')||d.classList.contains('match'))return;
  d.classList.add('flip');d.textContent=d.dataset.s;flipped.push(d);
  if(flipped.length===2){moves++;$('mm').textContent='MOVES: '+moves;const[a,b]=flipped;
   if(a.dataset.s===b.dataset.s){a.classList.add('match');b.classList.add('match');matched++;$('mp').textContent='PAIRS: '+matched+'/8';flipped=[];
    if(matched===8){const r=moves<=10?'PERFECT':moves<=14?'GREAT':'GOOD';setTimeout(()=>celebrate(`Solved in ${moves} moves — ${r}!`,'YOU MATCHED THEM ALL!'),300)}}
   else{lock=true;setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');a.textContent='?';b.textContent='?';flipped=[];lock=false},700)}}}
 build();
 $('mreset').onclick=()=>{deck=deck.sort(()=>Math.random()-.5);flipped=[];matched=0;moves=0;lock=false;$('mm').textContent='MOVES: 0';$('mp').textContent='PAIRS: 0/8';$('mr').textContent='find 8 pairs';build()};
}
// GUESS
function guess(){
 msgSet('🧠 Guess my number (1–100)');
 const sn=Math.floor(Math.random()*100)+1;let lives=6,guesses=[],over=false;
 areaSet(`<div class="stat"><span id="lv">❤️❤️❤️❤️❤️❤️</span><span id="gc">GUESSES: 0</span></div>
 <div class="row"><input type="number" id="gi" min="1" max="100" placeholder="1–100"><button id="gb">GUESS</button></div>
 <div class="res" id="gf">make your guess</div><div class="hist" id="gh">—</div>`);
 function up(){$('lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(6-lives)}
 function hint(d){if(d<=3)return'🔥🔥🔥 SCORCHING';if(d<=8)return'🔥🔥 HOT';if(d<=15)return'🔥 WARM';if(d<=30)return'❄️ COLD';return'🧊 FREEZING'}
 function chk(){if(over)return;const v=$('gi').value.trim();if(!v){$('gf').textContent='⛔ enter a number';return}
  const n=Number(v);if(!Number.isInteger(n)||n<1||n>100){$('gf').textContent='⚠️ 1–100 only';return}
  guesses.push(n);$('gc').textContent='GUESSES: '+guesses.length;$('gh').textContent=guesses.join(' · ');
  if(n===sn){$('gf').textContent=`🎉 ${sn} — CORRECT!`;over=true;$('gi').disabled=true;$('gb').disabled=true;celebrate(`${sn} is right!`,'YOU READ MY MIND!');return}
  lives--;up();const d=Math.abs(n-sn);$('gf').textContent=`${n<sn?'📈 too low':'📉 too high'} · ${hint(d)}`;
  if(lives<=0){$('gf').textContent=`💀 It was ${sn}`;over=true;$('gi').disabled=true;$('gb').disabled=true}
  else{$('gi').value='';$('gi').focus()}}
 $('gb').onclick=chk;$('gi').onkeypress=e=>{if(e.key==='Enter'){e.preventDefault();chk()}};up();$('gi').focus();
}
// COIN
function coin(){
 msgSet('⚡ Call the flip — build your streak');
 let streak=0,best=0,flips=0,over=false,lock=false;
 areaSet(`<div class="stat"><span id="cs">🔥 STREAK: 0</span><span id="cb">🏅 BEST: 0</span><span id="cf">FLIPS: 0</span></div>
 <div id="cd" style="font-size:4rem">🪙</div><div class="res" id="cr">heads or tails?</div>
 <div class="row"><button id="ch">HEADS</button><button id="ct">TAILS</button><button id="creset">RESET</button></div>
 <div style="font-size:.7rem;color:#b399dd">⚠️ one wrong call ends the run</div>`);
 function up(){$('cs').textContent='🔥 STREAK: '+streak;$('cb').textContent='🏅 BEST: '+best;$('cf').textContent='FLIPS: '+flips}
 function flip(p){if(over||lock)return;lock=true;flips++;$('cd').textContent='🌀';$('cr').textContent='flipping...';
  setTimeout(()=>{const h=Math.random()<.5;const a=h?'heads':'tails';$('cd').textContent=h?'👑':'⚡';
   if(a===p){streak++;if(streak>best)best=streak;$('cr').textContent=`✅ ${a.toUpperCase()} · streak ${streak}`;if(streak>=5)smallWin(`STREAK ${streak}!`)}
   else{$('cr').textContent=`❌ ${a.toUpperCase()} — you called ${p}`;over=true;$('ch').disabled=true;$('ct').disabled=true;if(best>=3)celebrate(`Best streak: ${best}`,'STILL IMPRESSIVE!')}
   up();lock=false},350)}
 $('ch').onclick=()=>flip('heads');$('ct').onclick=()=>flip('tails');
 $('creset').onclick=()=>{streak=0;best=0;flips=0;over=false;lock=false;$('ch').disabled=false;$('ct').disabled=false;$('cd').textContent='🪙';$('cr').textContent='heads or tails?';up()};up();
}
// REACTION
function reaction(){
 msgSet('🎯 Click when it turns GREEN');
 let state='idle',tid=null,t0=0,att=0,best=Infinity;
 areaSet(`<div class="stat"><span id="rb">🏅 BEST: —</span><span id="ra">ATTEMPTS: 0</span></div>
 <div class="rbox r-wait" id="rx">CLICK TO START</div><div class="res" id="rr">—</div>`);
 const x=$('rx');
 function wait(){state='waiting';x.className='rbox r-wait';x.textContent='WAIT FOR GREEN...';
  const d=1200+Math.random()*2500;tid=setTimeout(()=>{state='ready';x.className='rbox r-go';x.textContent='CLICK NOW!';t0=performance.now()},d)}
 x.onclick=()=>{
  if(state==='idle'){att++;$('ra').textContent='ATTEMPTS: '+att;wait()}
  else if(state==='waiting'){clearTimeout(tid);state='idle';x.className='rbox r-early';x.textContent='❌ TOO SOON! CLICK TO RETRY';$('rr').textContent='You jumped early.'}
  else if(state==='ready'){const rt=Math.round(performance.now()-t0);state='idle';x.className='rbox r-done';x.textContent=rt+' ms — CLICK TO RETRY';
   if(rt<best){best=rt;$('rb').textContent='🏅 BEST: '+best+' ms'}
   const rank=rt<180?'SUPERHUMAN':rt<250?'EXCELLENT':rt<350?'GOOD':rt<500?'OK':'SLOW';
   $('rr').textContent=`${rank} — ${rt} ms`;if(rt<250)celebrate(`${rt} ms!`,'LIGHTNING FAST!')}}
}
// MATH
function math(){
 msgSet('➗ Solve as many as you can in 60s');
 let score=0,time=60,playing=false,tid=null,ans=null,lock=false;
 areaSet(`<div class="stat"><span id="ms">SCORE: 0</span><span id="mt">⏱️ 60s</span></div>
 <div class="tbar-bg"><div class="tbar" id="mtb"></div></div>
 <div class="q" id="mq">Press START</div><div class="row" id="mc"><button id="mstart">START</button></div>
 <div class="res" id="mr" style="font-size:.85rem">—</div>`);
 function gen(){const ops=['+','-','*'];const op=ops[Math.floor(Math.random()*3)];let a,b,an;
  if(op==='+'){a=Math.floor(Math.random()*50)+10;b=Math.floor(Math.random()*50)+10;an=a+b}
  else if(op==='-'){a=Math.floor(Math.random()*50)+30;b=Math.floor(Math.random()*30)+1;an=a-b}
  else{a=Math.floor(Math.random()*12)+2;b=Math.floor(Math.random()*12)+2;an=a*b}
  ans=an;const wrong=new Set();while(wrong.size<3){const o=Math.floor(Math.random()*21)-10;const w=an+o;if(w!==an&&w>=0)wrong.add(w)}
  const ch=[an,...wrong].sort(()=>Math.random()-.5);
  $('mq').textContent=`${a} ${op} ${b} = ?`;$('mc').innerHTML='';
  ch.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>pick(c);$('mc').appendChild(b)});lock=false}
 function pick(c){if(!playing||lock)return;lock=true;
  if(c===ans){score++;$('ms').textContent='SCORE: '+score;$('mr').textContent=`✅ ${c} — correct!`;if(score%5===0)smallWin(`${score} CORRECT!`)}
  else{$('mr').textContent=`❌ ${c} — answer was ${ans}`}
  setTimeout(()=>{if(playing)gen()},250)}
 function end(){playing=false;clearInterval(tid);$('mq').textContent='⏰ TIME!';$('mc').innerHTML='';
  const rank=score>=25?'MATH GOD':score>=18?'SHARP':score>=12?'GOOD':score>=6?'OK':'KEEP PRACTICING';
  $('mr').textContent=`${rank} — score ${score}`;celebrate(`Final score: ${score}`,'YOU DID IT!')}
 $('mstart').onclick=()=>{score=0;time=60;playing=true;$('ms').textContent='SCORE: 0';$('mt').textContent='⏱️ 60s';$('mtb').style.width='100%';$('mr').textContent='Go!';gen();
  tid=setInterval(()=>{time-=.1;if(time<=0){time=0;end()}$('mt').textContent='⏱️ '+Math.ceil(time)+'s';$('mtb').style.width=(time/60*100)+'%'},100)};
}
// SIMON
function simon(){
 msgSet('🎵 Watch the pattern, repeat it');
 const colors=['g','r','b','y'];
 let seq=[],userIdx=0,showing=false,playing=false,round=0,best=0;
 areaSet(`<div class="stat"><span id="sr">ROUND: 0</span><span id="sb">🏅 BEST: 0</span></div>
 <div class="simon-pad" id="sp"><div class="pad g" data-c="g"></div><div class="pad r" data-c="r"></div><div class="pad b" data-c="b"></div><div class="pad y" data-c="y"></div></div>
 <div class="res" id="sm">Press START</div><button id="sstart">START</button>`);
 const pads=document.querySelectorAll('.pad');
 function flash(c,dur=400){const p=document.querySelector(`.pad[data-c="${c}"]`);p.classList.add('on');setTimeout(()=>p.classList.remove('on'),dur)}
 function playSeq(){showing=true;userIdx=0;let i=0;
  const iv=setInterval(()=>{if(i>=seq.length){clearInterval(iv);showing=false;$('sm').textContent='YOUR TURN — repeat!';return}
   flash(seq[i]);i++},650)}
 function nextRound(){round++;$('sr').textContent='ROUND: '+round;if(round%5===0)smallWin(`ROUND ${round}!`);
  seq.push(colors[Math.floor(Math.random()*4)]);setTimeout(playSeq,600)}
 pads.forEach(p=>p.onclick=()=>{
  if(!playing||showing)return;
  const c=p.dataset.c;flash(c,200);
  if(c===seq[userIdx]){userIdx++;if(userIdx===seq.length){if(round>best)best=round;$('sb').textContent='🏅 BEST: '+best;setTimeout(nextRound,700)}}
  else{playing=false;$('sm').textContent=`❌ WRONG! You reached round ${round}`;$('sstart').textContent='PLAY AGAIN';if(round>=5)celebrate(`Reached round ${round}!`,'AMAZING MEMORY!')}});
 $('sstart').onclick=()=>{seq=[];round=0;playing=true;$('sr').textContent='ROUND: 0';$('sm').textContent='Watch carefully...';nextRound()};
}
// SLOTS
function slots(){
 msgSet('🎰 Spin to match 3 symbols');
 const syms=['🍒','🍋','🔔','💎','7️⃣','⭐'];
 let credits=100,spinning=false,bestWin=0;
 areaSet(`<div class="stat"><span id="sc">💎 CREDITS: 100</span><span id="sbest">🏆 BEST WIN: 0</span></div>
 <div class="slot" id="sd"><div class="sym">❓</div><div class="sym">❓</div><div class="sym">❓</div></div>
 <div class="res" id="sres">cost: 10 per spin</div><button id="spin">SPIN · 10</button>`);
 function rnd(){return syms[Math.floor(Math.random()*syms.length)]}
 $('spin').onclick=()=>{
  if(spinning)return;
  if(credits<10){$('sres').textContent='❌ Not enough credits!';return}
  spinning=true;credits-=10;$('sc').textContent='💎 CREDITS: '+credits;
  const roll=setInterval(()=>{const s=document.querySelectorAll('#sd .sym');s.forEach(x=>x.textContent=rnd())},80);
  setTimeout(()=>{clearInterval(roll);
   const s=document.querySelectorAll('#sd .sym');const a=s[0].textContent,b=s[1].textContent,c=s[2].textContent;
   let win=0;if(a===b&&b===c){win=a==='7️⃣'?200:a==='💎'?100:50}else if(a===b||b===c||a===c){win=20}
   if(win>0){credits+=win;if(win>bestWin)bestWin=win;$('sc').textContent='💎 CREDITS: '+credits;$('sbest').textContent='🏆 BEST WIN: '+bestWin;$('sres').textContent=`🎉 WIN ${win}!`;
    if(win>=50)celebrate(`You won ${win} credits!`,'JACKPOT BABY!');else smallWin(`WIN ${win}!`)}
   else{$('sres').textContent='😬 no match — try again'}
   if(credits<10&&win===0){$('sres').textContent+=' · out of credits';$('spin').disabled=true}
   spinning=false},1400)};
}
// RPS
function rps(){
 msgSet('✊ First to 3 wins!');
 const mv={rock:'🪨',paper:'📄',scissors:'✂️'};let you=0,cpu=0,over=false;
 areaSet(`<div class="stat"><span id="ry">YOU: 0</span><span id="rc">CPU: 0</span></div>
 <div class="row" id="rd" style="font-size:2rem"><div>❓</div><div>VS</div><div>❓</div></div>
 <div class="res" id="rr">pick your move</div>
 <div class="row"><button data-m="rock">🪨</button><button data-m="paper">📄</button><button data-m="scissors">✂️</button></div>
 <button id="rreset">RESET</button>`);
 function up(){$('ry').textContent='YOU: '+you;$('rc').textContent='CPU: '+cpu}
 function play(m){if(over)return;
  const keys=Object.keys(mv);const c=keys[Math.floor(Math.random()*3)];
  $('rd').innerHTML=`<div style="font-size:2.5rem">${mv[m]}</div><div>VS</div><div style="font-size:2.5rem">${mv[c]}</div>`;
  if(m===c){$('rr').textContent=`🤝 TIE — both ${c}`}
  else if((m==='rock'&&c==='scissors')||(m==='paper'&&c==='rock')||(m==='scissors'&&c==='paper')){you++;$('rr').textContent=`✅ You win! ${m} beats ${c}`}
  else{cpu++;$('rr').textContent=`❌ CPU wins! ${c} beats ${m}`}
  up();
  if(you===3||cpu===3){over=true;$('rr').textContent=you===3?'🏆 YOU WIN THE MATCH!':'💀 CPU WINS THE MATCH!';
   if(you===3)celebrate('You beat the computer 3–'+cpu+'!','YOU DID IT!')}}
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>play(b.dataset.m));
 $('rreset').onclick=()=>{you=0;cpu=0;over=false;$('rd').innerHTML='<div>❓</div><div>VS</div><div>❓</div>';$('rr').textContent='pick your move';up()};up();
}
// HANGMAN
function word(){
 msgSet('🔤 Guess the hidden word');
 const WORDS=['ELEPHANT','GUITAR','PIZZA','DIAMOND','ROCKET','GALAXY','TIGER','WIZARD','DRAGON','CASTLE','THUNDER','OCEAN','PLANET','MONKEY','TREASURE','PYRAMID','VOLCANO','COMPASS','MIRROR','CANDLE'];
 const word=WORDS[Math.floor(Math.random()*WORDS.length)];
 let guessed=new Set(),wrong=0,maxWrong=6,over=false;
 areaSet(`<div class="stat"><span id="wl">❤️❤️❤️❤️❤️❤️</span><span id="ww">WRONG: 0/6</span></div>
 <div class="word-slots" id="ws"></div>
 <div class="keyboard" id="kb"></div>
 <div class="res" id="wr">pick a letter</div>`);
 function render(){const s=$('ws');s.innerHTML='';
  for(const ch of word){const d=document.createElement('div');d.className='word-slot';d.textContent=guessed.has(ch)?ch:'';s.appendChild(d)}}
 function keys(){const kb=$('kb');kb.innerHTML='';
  for(let i=0;i<26;i++){const ch=String.fromCharCode(65+i);const k=document.createElement('div');k.className='key';k.textContent=ch;
   if(guessed.has(ch))k.classList.add('used');k.onclick=()=>pick(ch);kb.appendChild(k)}}
 function pick(ch){if(over||guessed.has(ch))return;guessed.add(ch);
  const k=[...document.querySelectorAll('.key')].find(x=>x.textContent===ch);
  if(word.includes(ch)){if(k)k.classList.add('correct')}
  else{wrong++;if(k)k.classList.add('wrong');$('ww').textContent='WRONG: '+wrong+'/6'}
  $('wl').textContent='❤️'.repeat(maxWrong-wrong)+'🖤'.repeat(wrong);
  render();keys();
  if([...word].every(c=>guessed.has(c))){over=true;$('wr').textContent=`🎉 The word was ${word}`;celebrate(`You guessed "${word}"!`,'YOU DID IT!')}
  else if(wrong>=maxWrong){over=true;$('wr').textContent=`💀 Out of lives. It was ${word}`}}
 render();keys();
}
// TYPING
function typing(){
 msgSet('⌨️ Type the sentence as fast as you can!');
 const SENTENCES=['the quick brown fox jumps over the lazy dog','practice makes perfect every single day','coding is fun when you build cool things','stay hungry stay foolish keep learning','a journey of a thousand miles begins with one step','never give up on your dreams and goals'];
 const target=SENTENCES[Math.floor(Math.random()*SENTENCES.length)];
 let started=false,startTime=0,endTime=0,typed='',over=false;
 areaSet(`<div class="type-target" id="tt"></div>
 <input id="ti" placeholder="type here..." style="width:90%;max-width:500px" autocomplete="off">
 <div class="stat"><span id="tacc">ACCURACY: 100%</span><span id="ttime">TIME: 0.0s</span><span id="twpm">WPM: 0</span></div>
 <div class="res" id="tr">start typing!</div>`);
 const ti=$('ti'),tt=$('tt');
 function render(){let h='';for(let i=0;i<target.length;i++){
   const c=target[i];const t=typed[i];
   if(t===undefined)h+=c;
   else if(t===c)h+=`<span class="ok">${c}</span>`;
   else h+=`<span class="err">${c}</span>`}
  tt.innerHTML=h;
  const correct=[...typed].filter((c,i)=>c===target[i]).length;
  const acc=typed.length?Math.round(correct/typed.length*100):100;
  $('tacc').textContent='ACCURACY: '+acc+'%';
  if(started&&!over){const el=(performance.now()-startTime)/1000;$('ttime').textContent='TIME: '+el.toFixed(1)+'s';
   const words=correct/5;$('twpm').textContent='WPM: '+Math.round(words/(el/60))}}
 ti.oninput=()=>{if(over)return;typed=ti.value;
  if(!started){started=true;startTime=performance.now()}
  render();
  if(typed===target){over=true;endTime=performance.now();const el=(endTime-startTime)/1000;
   const correct=target.length;const wpm=Math.round((correct/5)/(el/60));
   $('tr').textContent=`🎉 ${el.toFixed(1)}s · ${wpm} WPM`;ti.disabled=true;
   celebrate(`${el.toFixed(1)}s · ${wpm} WPM`,'SPEED DEMON!')}}
 ti.focus();render();
}
// COLOR MATCH
function color(){
 msgSet('🌈 Click the WORD that matches the INK COLOR');
 const COLORS=[{n:'RED',c:'#ff4d4d'},{n:'BLUE',c:'#4d9dff'},{n:'GREEN',c:'#4ade80'},{n:'YELLOW',c:'#ffe066'},{n:'PURPLE',c:'#b16cff'},{n:'ORANGE',c:'#ff9d4d'}];
 let score=0,lives=5,over=false;
 areaSet(`<div class="stat"><span id="cos">SCORE: 0</span><span id="col">❤️❤️❤️❤️❤️</span></div>
 <div id="cbox" class="color-box" style="color:#fff">—</div>
 <div class="row" id="copts"></div>
 <div class="res" id="cor">pick the color name</div>`);
 function next(){
  if(lives<=0){over=true;$('cbox').textContent='💀';$('copts').innerHTML='';$('cor').textContent='Game over!';return}
  const inkColor=COLORS[Math.floor(Math.random()*COLORS.length)];
  let wordColor;do{wordColor=COLORS[Math.floor(Math.random()*COLORS.length)]}while(wordColor.n===inkColor.n);
  const correctAnswer=inkColor.n;
  $('cbox').style.color=inkColor.c;
  $('cbox').textContent=wordColor.n;
  const choices=new Set([inkColor.n]);
  while(choices.size<4){choices.add(COLORS[Math.floor(Math.random()*COLORS.length)].n)}
  const arr=[...choices].sort(()=>Math.random()-.5);
  const co=$('copts');co.innerHTML='';
  arr.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{
    if(over)return;
    if(n===correctAnswer){score++;$('cos').textContent='SCORE: '+score;$('cor').textContent='✅ Correct!';
     if(score%5===0)smallWin(`${score} CORRECT!`)}
    else{lives--;$('col').textContent='❤️'.repeat(lives)+'🖤'.repeat(5-lives);
     $('cor').textContent=`❌ The ink was ${inkColor.n}`;
     if(lives<=0)celebrate(`Final score: ${score}`,'GOOD EFFORT!')}
    setTimeout(next,600)};
   co.appendChild(b)});
 }
 next();
}
// WHACK-A-MOLE
function whack(){
 msgSet('🐹 Whack the moles! 30 seconds.');
 let score=0,time=30,playing=false,currentMole=-1,tid=null,tid2=null;
 areaSet(`<div class="stat"><span id="whs">SCORE: 0</span><span id="wht">⏱️ 30s</span><span id="whb">🏅 BEST: 0</span></div>
 <div class="mole-grid" id="mg"></div>
 <div class="res" id="whr">Press START</div>
 <button id="whstart">START</button>`);
 let best=0;
 const mg=$('mg');
 for(let i=0;i<9;i++){const m=document.createElement('div');m.className='mole';m.dataset.i=i;m.textContent='🕳️';
  m.onclick=()=>{if(!playing)return;if(i===currentMole){score++;$('whs').textContent='SCORE: '+score;
    m.textContent='💥';setTimeout(()=>{if(m.textContent==='💥')m.textContent='🕳️'},150);
    if(score%10===0)smallWin(`${score} WHACKED!`)}};
  mg.appendChild(m)}
 function showMole(){const moles=document.querySelectorAll('.mole');moles.forEach(m=>{m.textContent='🕳️';m.classList.remove('up')});
  currentMole=Math.floor(Math.random()*9);moles[currentMole].textContent='🐹';moles[currentMole].classList.add('up')}
 function start(){score=0;time=30;playing=true;$('whs').textContent='SCORE: 0';$('wht').textContent='⏱️ 30s';$('whr').textContent='Go!';
  tid=setInterval(showMole,700);showMole();
  tid2=setInterval(()=>{time-=.1;if(time<=0){time=0;end()}else $('wht').textContent='⏱️ '+Math.ceil(time)+'s'},100)}
 function end(){playing=false;clearInterval(tid);clearInterval(tid2);
  document.querySelectorAll('.mole').forEach(m=>{m.textContent='🕳️';m.classList.remove('up')});
  if(score>best)best=score;$('whb').textContent='🏅 BEST: '+best;
  $('whr').textContent=`⏰ Time! Score: ${score}`;
  celebrate(`You whacked ${score} moles!`,score>=25?'RUTHLESS!':'NICE WORK!')}
 $('whstart').onclick=start;
}
